<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Sage Rebello</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black:  #0d0d0d;
  --mid:    #666;
  --light:  #f5f5f3;
  --border: #e0e0da;
  --max:    860px;
  --pad:    clamp(20px, 5vw, 60px);
}

html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #fff;
  color: var(--black);
  -webkit-font-smoothing: antialiased;
}
a { text-decoration: none; color: inherit; }

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 22px var(--pad);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  font-size: 0.72rem; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase;
}
.nav-links { display: flex; gap: 28px; }
.nav-links a { font-size: 0.82rem; color: var(--mid); letter-spacing: 0.04em; transition: color .2s; }
.nav-links a:hover { color: var(--black); }

/* ── CONTACT SECTION ── */
.contact-section {
  max-width: var(--max);
  margin: 0 auto;
  padding: 140px var(--pad) 80px;
  border-bottom: 1px solid var(--border);
}

.contact-kicker {
  font-size: 0.62rem; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--mid); margin-bottom: 20px;
}

.contact-heading {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(2.2rem, 5vw, 3.8rem);
  line-height: 1.05; color: var(--black);
  margin-bottom: 16px;
}
.contact-heading em { font-style: italic; color: var(--black); }

.contact-sub {
  font-size: 0.95rem; line-height: 1.75;
  color: var(--mid); max-width: 480px;
  margin-bottom: 56px;
}

/* ── FORM ── */
.contact-form {
  display: flex; flex-direction: column; gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
}

.form-field {
  background: #fff;
  padding: 24px 24px 20px;
  display: flex; flex-direction: column; gap: 8px;
}

.form-field.full {
  grid-column: 1 / -1;
}

.field-label {
  font-size: 0.6rem; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--mid);
}

.field-input,
.field-textarea {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem; color: var(--black);
  background: transparent;
  border: none; outline: none;
  width: 100%;
  padding: 0;
  resize: none;
  line-height: 1.6;
}

.field-input::placeholder,
.field-textarea::placeholder {
  color: #bbb;
}

.field-input:focus ~ .field-border,
.field-textarea:focus ~ .field-border {
  opacity: 1;
}

.field-textarea {
  min-height: 140px;
}

/* ── SUBMIT ROW ── */
.form-submit-row {
  background: #fff;
  padding: 24px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.form-note {
  font-size: 0.75rem; color: var(--mid); line-height: 1.5;
}

.submit-btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem; font-weight: 500;
  letter-spacing: 0.06em;
  color: #fff;
  background: var(--black);
  border: 1px solid var(--black);
  padding: 12px 24px;
  border-radius: 2px;
  cursor: pointer;
  transition: background .2s, color .2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.submit-btn:hover { background: #333; }
.submit-btn:active { background: #555; }

/* ── SUCCESS STATE ── */
.form-success {
  display: none;
  background: #fff;
  padding: 48px 32px;
  text-align: center;
}
.form-success.visible { display: block; }
.contact-form.sent { display: none; }

.success-heading {
  font-family: 'DM Serif Display', serif;
  font-size: 1.6rem; font-style: italic;
  color: var(--black); margin-bottom: 10px;
}
.success-body {
  font-size: 0.88rem; color: var(--mid); line-height: 1.7;
}

/* ── LINKS ROW ── */
.contact-links {
  display: flex; gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 4px; overflow: hidden;
  margin-top: 1px;
}
.contact-link {
  flex: 1; background: #fff;
  padding: 20px 24px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.82rem; font-weight: 500;
  color: var(--black);
  transition: background .15s;
}
.contact-link:hover { background: var(--light); }
.contact-link-label {
  font-size: 0.6rem; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--mid); display: block; margin-bottom: 4px;
}
.contact-link svg { opacity: 0.4; flex-shrink: 0; }

/* ── FOOTER ── */
footer {
  max-width: var(--max); margin: 0 auto;
  padding: 48px var(--pad);
  display: flex; justify-content: space-between; align-items: center;
}
.footer-name {
  font-size: 0.72rem; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--mid);
}

/* ── RESPONSIVE ── */
@media (max-width: 560px) {
  .form-row { grid-template-columns: 1fr; }
  .form-submit-row { flex-direction: column; align-items: flex-start; }
  .contact-links { flex-direction: column; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Sage Rebello</a>
  <div class="nav-links">
    <a href="art.html">art</a>
    <a href="work.html">work</a>
    <a href="about.html">about</a>
  </div>
</nav>

<!-- CONTACT SECTION — drop this into your about.html -->
<section class="contact-section">
  <p class="contact-kicker">Contact</p>
  <h2 class="contact-heading">Leave me<br><em>a note.</em></h2>
  <p class="contact-sub">Whether it's a project, a question, or just to say hi — I read everything and write back.</p>

  <form
    class="contact-form"
    action="https://formspree.io/f/xrevlzlj"
    method="POST"
    id="contactForm"
  >
    <div class="form-row">
      <div class="form-field">
        <label class="field-label" for="name">Name</label>
        <input
          class="field-input"
          id="name" name="name"
          type="text"
          placeholder="Your name"
          required
        >
      </div>
      <div class="form-field">
        <label class="field-label" for="email">Email</label>
        <input
          class="field-input"
          id="email" name="email"
          type="email"
          placeholder="your@email.com"
          required
        >
      </div>
    </div>

    <div class="form-row">
      <div class="form-field full">
        <label class="field-label" for="subject">Subject</label>
        <input
          class="field-input"
          id="subject" name="subject"
          type="text"
          placeholder="What's it about?"
        >
      </div>
    </div>

    <div class="form-row">
      <div class="form-field full">
        <label class="field-label" for="message">Message</label>
        <textarea
          class="field-textarea"
          id="message" name="message"
          placeholder="Write your note here..."
          required
        ></textarea>
      </div>
    </div>

    <div class="form-submit-row">
      <span class="form-note">I'll get back to you within a few days.</span>
      <button class="submit-btn" type="submit">
        Send note
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 7H11.5M7.5 3L11.5 7L7.5 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </form>

  <div class="form-success" id="formSuccess">
    <div class="success-heading">Note sent.</div>
    <p class="success-body">Thanks for reaching out — I'll be in touch soon.</p>
  </div>


</section>

<footer>
  <span class="footer-name">Sage Rebello</span>
</footer>

<script>
  const form = document.getElementById("contactForm");
  const success = document.getElementById("formSuccess");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = new FormData(form);
    const btn = form.querySelector(".submit-btn");
    btn.textContent = "Sending…";
    btn.disabled = true;

    try {
      const res = await fetch(form.action, {
        method: "POST",
        body: data,
        headers: { Accept: "application/json" }
      });

      if (res.ok) {
        form.classList.add("sent");
        success.classList.add("visible");
      } else {
        btn.textContent = "Try again";
        btn.disabled = false;
      }
    } catch {
      btn.textContent = "Try again";
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
