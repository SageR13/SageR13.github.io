<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive STL Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --text: #ffffff;
            --accent: #646cff;
            --secondary: #535bf2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(100, 108, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(83, 91, 242, 0.15) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #646cff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .viewer-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #canvas-container {
            width: 100%;
            height: 600px;
            position: relative;
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%);
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            display: none;
            text-align: center;
        }

        .loading.active {
            display: block;
        }

        .controls {
            padding: 2rem;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .file-input-wrapper {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .file-input-label {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        input[type="file"] {
            width: 100%;
            padding: 1rem;
            background: rgba(100, 108, 255, 0.1);
            border: 2px solid rgba(100, 108, 255, 0.3);
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
        }

        input[type="file"]:hover {
            background: rgba(100, 108, 255, 0.2);
            border-color: var(--accent);
        }

        input[type="file"]::file-selector-button {
            padding: 0.5rem 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--secondary);
            transform: translateY(-1px);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            padding: 1rem 1.5rem;
            background: rgba(100, 108, 255, 0.2);
            color: var(--text);
            border: 1px solid rgba(100, 108, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        button:hover {
            background: rgba(100, 108, 255, 0.3);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-item {
            text-align: center;
            padding: 1rem;
            background: rgba(100, 108, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(100, 108, 255, 0.1);
        }

        .info-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .instructions {
            background: rgba(100, 108, 255, 0.05);
            padding: 1.5rem;
            border-radius: 10px;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            border: 1px solid rgba(100, 108, 255, 0.1);
        }

        .instructions strong {
            color: var(--accent);
            font-weight: 600;
        }

        .placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
        }

        .placeholder-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .placeholder-text {
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.8rem;
                margin-bottom: 1rem;
            }

            #canvas-container {
                height: 400px;
            }

            .controls {
                padding: 1.5rem;
            }

            .file-input-wrapper {
                flex-direction: column;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="container">
        <h1>🔷 Interactive STL Viewer</h1>
        <div class="viewer-card">
            <div id="canvas-container">
                <div class="placeholder" id="placeholder">
                    <div class="placeholder-icon">📦</div>
                    <div class="placeholder-text">Upload an STL file to begin</div>
                </div>
                <div class="loading" id="loading">
                    <div>Loading 3D model...</div>
                </div>
            </div>
            <div class="controls">
                <div class="file-input-wrapper">
                    <div class="file-input-label">
                        <input type="file" id="fileInput" accept=".stl" />
                    </div>
                    <div class="button-group">
                        <button onclick="resetView()">Reset View</button>
                        <button onclick="toggleWireframe()">Toggle Wireframe</button>
                    </div>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Triangles</div>
                        <div class="info-value" id="triangles">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Vertices</div>
                        <div class="info-value" id="vertices">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">File Size</div>
                        <div class="info-value" id="filesize">-</div>
                    </div>
                </div>
                <div class="instructions">
                    <strong>Controls:</strong> Left click + drag to rotate • Right click + drag to pan • Scroll to zoom • Double click to focus
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, mesh, controls;
        let wireframeMode = false;
        const container = document.getElementById('canvas-container');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const placeholder = document.getElementById('placeholder');

        // Initialize Three.js scene
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(
                45,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(1, 1, 1);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0x646cff, 0.4);
            directionalLight2.position.set(-1, -1, -1);
            scene.add(directionalLight2);

            // Mouse controls
            setupControls();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        // Custom mouse controls
        function setupControls() {
            let isDragging = false;
            let isPanning = false;
            let previousMousePosition = { x: 0, y: 0 };

            container.addEventListener('mousedown', (e) => {
                if (e.button === 0) isDragging = true;
                if (e.button === 2) isPanning = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            container.addEventListener('mousemove', (e) => {
                if (!mesh) return;

                const deltaMove = {
                    x: e.clientX - previousMousePosition.x,
                    y: e.clientY - previousMousePosition.y
                };

                if (isDragging) {
                    mesh.rotation.y += deltaMove.x * 0.01;
                    mesh.rotation.x += deltaMove.y * 0.01;
                }

                if (isPanning) {
                    camera.position.x -= deltaMove.x * 0.05;
                    camera.position.y += deltaMove.y * 0.05;
                }

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            container.addEventListener('mouseup', () => {
                isDragging = false;
                isPanning = false;
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY * 0.05;
                camera.position.z += delta;
                camera.position.z = Math.max(10, Math.min(500, camera.position.z));
            });

            container.addEventListener('contextmenu', (e) => e.preventDefault());

            container.addEventListener('dblclick', () => {
                if (mesh) {
                    camera.lookAt(mesh.position);
                }
            });
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Load STL file
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                loadSTL(file);
            }
        });

        function loadSTL(file) {
            loading.classList.add('active');
            placeholder.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (event) => {
                const arrayBuffer = event.target.result;
                const geometry = parseSTL(arrayBuffer);

                if (mesh) {
                    scene.remove(mesh);
                }

                const material = new THREE.MeshPhongMaterial({
                    color: 0x646cff,
                    specular: 0x111111,
                    shininess: 200,
                    flatShading: false
                });

                mesh = new THREE.Mesh(geometry, material);

                // Center and scale the model
                geometry.computeBoundingBox();
                const boundingBox = geometry.boundingBox;
                const center = new THREE.Vector3();
                boundingBox.getCenter(center);
                mesh.position.sub(center);

                const size = new THREE.Vector3();
                boundingBox.getSize(size);
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 50 / maxDim;
                mesh.scale.setScalar(scale);

                scene.add(mesh);

                // Update stats
                document.getElementById('triangles').textContent = geometry.attributes.position.count / 3;
                document.getElementById('vertices').textContent = geometry.attributes.position.count;
                document.getElementById('filesize').textContent = formatFileSize(file.size);

                loading.classList.remove('active');
                camera.position.set(0, 0, 100);
            };

            reader.readAsArrayBuffer(file);
        }

        // Parse STL file
        function parseSTL(arrayBuffer) {
            const view = new DataView(arrayBuffer);
            const isASCII = isASCIISTL(arrayBuffer);

            if (isASCII) {
                return parseASCIISTL(new TextDecoder().decode(arrayBuffer));
            } else {
                return parseBinarySTL(view);
            }
        }

        function isASCIISTL(arrayBuffer) {
            const view = new Uint8Array(arrayBuffer);
            const header = String.fromCharCode.apply(null, view.subarray(0, 5));
            return header === 'solid';
        }

        function parseBinarySTL(view) {
            const triangles = view.getUint32(80, true);
            const vertices = [];
            const normals = [];

            for (let i = 0; i < triangles; i++) {
                const offset = 84 + i * 50;

                const nx = view.getFloat32(offset, true);
                const ny = view.getFloat32(offset + 4, true);
                const nz = view.getFloat32(offset + 8, true);

                for (let j = 0; j < 3; j++) {
                    const vOffset = offset + 12 + j * 12;
                    vertices.push(
                        view.getFloat32(vOffset, true),
                        view.getFloat32(vOffset + 4, true),
                        view.getFloat32(vOffset + 8, true)
                    );
                    normals.push(nx, ny, nz);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            return geometry;
        }

        function parseASCIISTL(text) {
            const vertices = [];
            const normals = [];
            const normalPattern = /normal\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)/g;
            const vertexPattern = /vertex\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)/g;

            let normalMatch;
            const normalsList = [];
            while ((normalMatch = normalPattern.exec(text)) !== null) {
                normalsList.push([
                    parseFloat(normalMatch[1]),
                    parseFloat(normalMatch[2]),
                    parseFloat(normalMatch[3])
                ]);
            }

            let vertexMatch;
            let normalIndex = 0;
            let vertexCount = 0;
            while ((vertexMatch = vertexPattern.exec(text)) !== null) {
                vertices.push(
                    parseFloat(vertexMatch[1]),
                    parseFloat(vertexMatch[2]),
                    parseFloat(vertexMatch[3])
                );
                
                if (normalIndex < normalsList.length) {
                    normals.push(...normalsList[normalIndex]);
                }
                
                vertexCount++;
                if (vertexCount % 3 === 0) {
                    normalIndex++;
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            return geometry;
        }

        function resetView() {
            if (mesh) {
                mesh.rotation.set(0, 0, 0);
                camera.position.set(0, 0, 100);
                camera.lookAt(0, 0, 0);
            }
        }

        function toggleWireframe() {
            if (mesh) {
                wireframeMode = !wireframeMode;
                mesh.material.wireframe = wireframeMode;
            }
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
